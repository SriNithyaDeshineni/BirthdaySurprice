<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something For You 💗</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div id="questionBox">

            <div class="emoji">💌</div>

            <h1>Hey You! 👀</h1>

            <p>
                I made something special for you...
            </p>

            <p class="question">
                Do you want to see it? 🥹
            </p>

            <div class="buttons">
                <button onclick="sayYes()">YES 💗</button>
                <button onclick="sayNo()">NO 🙄</button>
            </div>

        </div>


        <div id="noBox" class="hidden">

            <div class="emoji">😤</div>

            <h1>HOW DARE U 😭</h1>

            <p>
                I spent so much time making this for you! 😭
            </p>

            <p>
                You're not getting away that easily...
            </p>

            <button class="okay-btn" onclick="goToBirthday()">
                Okay okay 😭💗
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
